services:
  web:
    command: bash .agents/preview-nginx
    health: /_preview/health
    portal:
      title: Liam Hammett
      description: Laravel preview with Nginx serving podcast media directly. Run bun run build after frontend edits.
  php:
    command: php artisan optimize:clear && php artisan serve --host=127.0.0.1 --port="$PORT"
    port: 8000
    health: /
    env:
      APP_URL: ${services.web.publicURL}
      ASSET_URL: ${services.web.publicURL}
